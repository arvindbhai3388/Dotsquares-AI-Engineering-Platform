<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="640" fill="#f4f6f8"/>

  <!-- Mockup disclaimer banner -->
  <rect x="0" y="0" width="1000" height="28" fill="#7a1f1f"/>
  <text x="500" y="19" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold" letter-spacing="0.5">
    ILLUSTRATIVE MOCKUP — NOT AN ACTUAL SCREENSHOT
  </text>

  <!-- Top nav -->
  <rect x="0" y="28" width="1000" height="52" fill="#1e3a5f"/>
  <text x="24" y="61" fill="#ffffff" font-size="18" font-weight="bold">Client Reporting Portal</text>
  <text x="640" y="61" fill="#cbd5e1" font-size="14">Dashboard</text>
  <rect x="632" y="70" width="80" height="3" fill="#60a5fa"/>
  <text x="742" y="61" fill="#94a3b8" font-size="14">Documents</text>
  <text x="850" y="61" fill="#94a3b8" font-size="14">Admin</text>

  <!-- Power BI embed placeholder -->
  <rect x="24" y="104" width="608" height="330" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
