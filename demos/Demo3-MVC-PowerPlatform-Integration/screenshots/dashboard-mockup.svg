  <rect x="48" y="156" width="560" height="256" rx="6" fill="#eef2ff" stroke="#c7d2fe" stroke-dasharray="6,4"/>
  <text x="328" y="270" text-anchor="middle" fill="#6366f1" font-size="14">IPowerBiEmbedService → MockPowerBiEmbedService</text>
  <text x="328" y="292" text-anchor="middle" fill="#94a3b8" font-size="12">(real report renders here once wired to Power BI REST API)</text>

  <!-- Documents panel -->
  <rect x="656" y="104" width="320" height="330" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="680" y="136" fill="#0f172a" font-size="16" font-weight="bold">Documents (mock)</text>
  <g font-size="12" fill="#334155">
    <text x="680" y="168">📄 Q3-Client-Summary.docx</text>
