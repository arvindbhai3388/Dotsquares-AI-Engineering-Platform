  <!-- Bottom status strip -->
  <rect x="24" y="452" width="952" height="140" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="48" y="484" fill="#0f172a" font-size="16" font-weight="bold">Admin — active service bindings</text>
  <g font-size="13" fill="#334155">
